name: Anchore Container Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '00 07 * * *'

permissions:
  contents: read

env:
  APP_NAME: pagopacruscottosertbackend
  DOCKERFILE: Dockerfile

jobs:
  Anchore-Build-Scan:
    permissions:
      contents: read
      security-events: write
      actions: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: |
          docker build . \
            --file ${{ env.DOCKERFILE }} \
            --force-rm \
            --tag localbuild/testimage:latest

      - name: Run Anchore scan
        uses: anchore/scan-action@v3
        with:
          image: "localbuild/testimage:latest"
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: results.sarif

      - name: Debug SARIF
        run: |
          ls -lah
          test -f results.sarif || exit 1
          wc -c results.sarif
          head -20 results.sarif

      - name: Validate SARIF
        run: |
          jq empty results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
