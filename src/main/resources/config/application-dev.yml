# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    com.nexigroup.pagopa.cruscotto: INFO

spring:
  cloud:
    aws:
      credentials:
        access-key: awsAccessKey
        secret-key: awsSecretKey
      region:
        static: awsRegion
  devtools:
    restart:
      enabled: false
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  jpa:
    properties:
      hibernate:
        generate_statistics: false
    show-sql: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://10.8.79.25:3306/qualification_dashboard
    username: qualification_dashboard
    password: qualification_dashboard
    hikari:
      poolName: Hikari
      auto-commit: false
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

server:
  port: 8080
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

jhipster:
  cache: # Cache configuration
    ehcache: # Ehcache configuration
      time-to-live-seconds: 3600 # By default objects stay 1 hour in the cache
      max-entries: 100 # Number of objects in each cache entry
  # CORS is only enabled by default with the "dev" profile
  cors:
    allowed-origins: '*'
    allowed-origin-patterns: '*'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        base64-secret: H0yzX/OFWdXBNaWy8b7Q9ZgZA1vTtJSbtuDZlD7tDNCBVRtXuubLzVSVV+B8wUA5p2w3pQ33YNRpHE/SENWqO0F9koHqYcRcN10oj9XSf6jYE5F71PoNJhZEgoLFhsHB2pMqrlUfrIGwotMUKTCDCydsa70BbGBL9JlsREXBKAg=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

azure:
  blob:
    connection-string: ${AZURE_BLOB_CONNECTION_STRING}
    container-name: ${AZURE_BLOB_CONTAINER_NAME:report}


application:
  mail:
    base-url: http://localhost:8080/
  aws:
    ses:
      user: awsSesUser
  enable-csrf: false
  password:
    day-password-expired: 60
    failed-login-attempts: 4
    hours-key-reset-password-expired: 1
  auth-group:
    super-admin: NEXI


decorator:
  datasource:
    p6spy:
      multiline: true
      logging: slf4j
      enable-logging: false
